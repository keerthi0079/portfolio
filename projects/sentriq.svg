<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="soc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#0e0a1f"/>
      <stop offset="100%" stop-color="#070512"/>
    </linearGradient>
    <linearGradient id="soc-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="threat-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="soc-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#soc-bg)"/>

  <!-- Matrix / Cyber Grid -->
  <g stroke="#818cf8" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Glowing Aura -->
  <circle cx="200" cy="150" r="160" fill="#818cf8" opacity="0.15" filter="blur(45px)"/>
  <circle cx="650" cy="350" r="180" fill="#c084fc" opacity="0.15" filter="blur(55px)"/>

  <!-- SOC Dashboard Frame -->
  <g transform="translate(40, 35)" filter="url(#soc-shadow)">
    <rect width="720" height="430" rx="12" fill="#110d24" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1.5"/>
    
    <!-- Top Header Bar -->
    <rect width="720" height="44" rx="12" fill="#181333"/>
    <rect y="32" width="720" height="12" fill="#181333"/>
    
    <!-- Status Indicator -->
    <circle cx="30" cy="22" r="5" fill="#34d399"/>
    <text x="45" y="27" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5">SENTRIQ <tspan fill="#818cf8">AI-SOC</tspan></text>
    
    <rect x="230" y="12" width="160" height="20" rx="10" fill="rgba(129,140,248,0.15)" stroke="rgba(129,140,248,0.3)"/>
    <circle cx="242" cy="22" r="3" fill="#818cf8"/>
    <text x="252" y="26" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">AUTONOMOUS XAI ACTIVE</text>

    <text x="600" y="26" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">● 96.67% ACCURACY</text>

    <!-- Left Telemetry Panel -->
    <g transform="translate(25, 60)">
      <!-- Panel 1: Live Stream Graph -->
      <rect width="420" height="180" rx="10" fill="#15102e" stroke="rgba(255,255,255,0.06)"/>
      <text x="20" y="28" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Network Telemetry &amp; Attack Vector Stream</text>
      <text x="20" y="44" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">UNSW-NB15 &amp; CIC-IDS2017 Dataset Ingestion</text>

      <!-- Waveform Graph -->
      <path d="M 20 140 Q 60 70 100 110 T 180 80 T 260 130 T 320 60 T 380 90 L 400 100" fill="none" stroke="#818cf8" stroke-width="2.5"/>
      <path d="M 20 140 Q 60 70 100 110 T 180 80 T 260 130 T 320 60 T 380 90 L 400 100 L 400 160 L 20 160 Z" fill="url(#threat-grad)" opacity="0.4"/>
      
      <!-- Critical Threat Marker -->
      <circle cx="320" cy="60" r="5" fill="#ef4444"/>
      <rect x="290" y="30" width="80" height="20" rx="4" fill="#ef4444"/>
      <text x="300" y="44" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9" font-weight="800">THREAT: 98%</text>

      <!-- Panel 2: SHAP Feature Attributions -->
      <g transform="translate(0, 195)">
        <rect width="420" height="150" rx="10" fill="#15102e" stroke="rgba(255,255,255,0.06)"/>
        <text x="20" y="26" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">SHAP TreeExplainer (XAI Verdict Decision Bridge)</text>
        
        <!-- Bars -->
        <text x="20" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Packet Duration</text>
        <rect x="130" y="43" width="220" height="10" rx="5" fill="rgba(129,140,248,0.2)"/>
        <rect x="130" y="43" width="185" height="10" rx="5" fill="#818cf8"/>

        <text x="20" y="77" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">SYN-ACK Ratio</text>
        <rect x="130" y="68" width="220" height="10" rx="5" fill="rgba(129,140,248,0.2)"/>
        <rect x="130" y="68" width="150" height="10" rx="5" fill="#c084fc"/>

        <text x="20" y="102" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Dst Port Entropy</text>
        <rect x="130" y="93" width="220" height="10" rx="5" fill="rgba(129,140,248,0.2)"/>
        <rect x="130" y="93" width="110" height="10" rx="5" fill="#38bdf8"/>
        
        <text x="20" y="132" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">● 93.3% Alert Noise Eliminated via 15-min Sliding Window</text>
      </g>
    </g>

    <!-- Right Side Metrics & Containment -->
    <g transform="translate(460, 60)">
      <!-- Metric Box 1 -->
      <rect width="235" height="105" rx="10" fill="#181335" stroke="rgba(129, 140, 248, 0.25)"/>
      <text x="20" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">HITL CONTAINMENT</text>
      <text x="20" y="65" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">CONTAINED</text>
      <rect x="20" y="75" width="105" height="18" rx="4" fill="rgba(52,211,153,0.15)"/>
      <text x="28" y="88" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">FIREWALL DROP</text>

      <!-- Metric Box 2 -->
      <g transform="translate(0, 118)">
        <rect width="235" height="105" rx="10" fill="#181335" stroke="rgba(129, 140, 248, 0.25)"/>
        <text x="20" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">MITRE ATT&amp;CK TECHNIQUE</text>
        <text x="20" y="60" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="20" font-weight="800">T1110 / T1059</text>
        <text x="20" y="85" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Command &amp; Scripting Interpreter</text>
      </g>

      <!-- Metric Box 3 -->
      <g transform="translate(0, 236)">
        <rect width="235" height="109" rx="10" fill="url(#soc-purple)"/>
        <text x="20" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="800">Autonomous SOC</text>
        <text x="20" y="52" fill="#ffffff" opacity="0.9" font-family="-apple-system, sans-serif" font-size="11">FastAPI • React 18 • WebSocket</text>
        <rect x="20" y="68" width="110" height="26" rx="6" fill="#0f0b24"/>
        <text x="32" y="85" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">VIEW REPO ↗</text>
      </g>
    </g>
  </g>
</svg>
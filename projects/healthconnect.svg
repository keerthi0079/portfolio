<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="med-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092f24"/>
      <stop offset="50%" stop-color="#061f18"/>
      <stop offset="100%" stop-color="#03100c"/>
    </linearGradient>
    <linearGradient id="med-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144d3b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#062119" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="med-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="med-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#med-bg)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="140" r="140" fill="#34d399" opacity="0.14" filter="blur(40px)"/>
  <circle cx="680" cy="380" r="170" fill="#10b981" opacity="0.18" filter="blur(50px)"/>

  <!-- Dashboard Frame -->
  <g transform="translate(40, 35)" filter="url(#med-shadow)">
    <rect width="720" height="430" rx="12" fill="#08211b" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.5"/>

    <!-- Header Bar -->
    <rect width="720" height="44" rx="12" fill="#0c2d25"/>
    <rect y="32" width="720" height="12" fill="#0c2d25"/>

    <circle cx="28" cy="22" r="5" fill="#34d399"/>
    <text x="44" y="27" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="1">E-SWASTHYA <tspan fill="#34d399">CONNECT</tspan></text>

    <!-- Role Pill Toggles in Header -->
    <rect x="230" y="10" width="90" height="24" rx="6" fill="#144d3b"/>
    <text x="245" y="26" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Villager</text>

    <rect x="330" y="10" width="90" height="24" rx="6" fill="#1a5c47"/>
    <text x="345" y="26" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">ANMS Area</text>

    <rect x="430" y="10" width="90" height="24" rx="6" fill="#144d3b"/>
    <text x="450" y="26" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Doctor</text>

    <text x="590" y="26" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11">● Active Rural Triage</text>

    <!-- Main Workspace Content -->
    <g transform="translate(25, 65)">
      <!-- Left: Patient Telemedicine Case Card -->
      <rect width="400" height="330" rx="10" fill="#0b2921" stroke="rgba(255,255,255,0.06)"/>
      <text x="20" y="30" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Clinical Case Ingestion &amp; Photo Triage</text>
      
      <!-- Subcard: Case Details -->
      <g transform="translate(20, 50)">
        <rect width="360" height="85" rx="8" fill="#10382d" stroke="rgba(52,211,153,0.2)"/>
        <rect x="15" y="15" width="55" height="55" rx="6" fill="#09221b"/>
        <text x="25" y="47" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">PHOTO</text>
        <text x="85" y="34" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Case #RUR-849: Acute Respiratory</text>
        <text x="85" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Patient: Villager (Age 42) • Vizianagaram</text>
        <rect x="85" y="60" width="85" height="16" rx="4" fill="rgba(239,68,68,0.2)"/>
        <text x="92" y="72" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">HIGH PRIORITY</text>
      </g>

      <!-- ECG Telemetry Heartbeat -->
      <g transform="translate(20, 155)">
        <rect width="360" height="70" rx="8" fill="#0c3027"/>
        <path d="M 10 35 L 70 35 L 85 15 L 100 55 L 115 25 L 130 45 L 145 35 L 210 35 L 225 15 L 240 55 L 255 35 L 350 35" fill="none" stroke="#34d399" stroke-width="2"/>
        <text x="15" y="20" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">VITAL SIGN TELEMETRY STREAM</text>
      </g>

      <!-- Action Triage Bar -->
      <g transform="translate(20, 245)">
        <rect width="170" height="36" rx="6" fill="url(#med-glow)"/>
        <text x="32" y="23" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Assign To ANMS ↗</text>

        <rect x="190" y="0" width="170" height="36" rx="6" fill="#144d3b" stroke="rgba(52,211,153,0.3)"/>
        <text x="215" y="23" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Escalate to Doctor</text>
      </g>
    </g>

    <!-- Right Side Stats & Verification -->
    <g transform="translate(445, 65)">
      <!-- Right Box 1 -->
      <rect width="250" height="155" rx="10" fill="#0b2a22" stroke="rgba(52, 211, 153, 0.25)"/>
      <text x="20" y="30" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">SECURITY &amp; DB ARCHITECTURE</text>
      <text x="20" y="65" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">RBAC Safe</text>
      <text x="20" y="90" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Prepared Statements • CSRF Protected</text>
      <text x="20" y="110" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Hashed Passwords (PHP password_hash)</text>
      <text x="20" y="132" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">● 20+ Functional PHP Pages</text>

      <!-- Right Box 2 -->
      <g transform="translate(0, 175)">
        <rect width="250" height="150" rx="10" fill="#113e32" stroke="rgba(52,211,153,0.3)"/>
        <text x="20" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="800">Community Healthcare</text>
        <text x="20" y="55" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11">Empowering rural medical triage &amp; clinical follow-ups.</text>
        <rect x="20" y="85" width="130" height="32" rx="6" fill="#09221b"/>
        <text x="32" y="105" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">PROJECT READY</text>
      </g>
    </g>
  </g>
</svg>
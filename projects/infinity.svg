<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%" height="100%">
  <defs>
    <linearGradient id="inf-bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3f68"/>
      <stop offset="50%" stop-color="#142442"/>
      <stop offset="100%" stop-color="#0a1224"/>
    </linearGradient>
    <linearGradient id="inf-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1a38"/>
      <stop offset="50%" stop-color="#070e1f"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>
    <linearGradient id="inf-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="830" height="540" rx="28" fill="url(#inf-bezel)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="16" y="16" width="818" height="528" rx="24" fill="#060c1d" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  
  <circle cx="425" cy="28" r="4" fill="#1b2a47" stroke="#334b75" stroke-width="1"/>
  <circle cx="425" cy="28" r="1.5" fill="#38bdf8"/>

  <g transform="translate(32, 42)">
    <rect width="786" height="476" rx="16" fill="url(#inf-screen)" stroke="#1a2d52" stroke-width="1.5"/>

    <!-- Browser Bar -->
    <rect width="786" height="42" rx="16" fill="#101f3d"/>
    <rect y="30" width="786" height="12" fill="#101f3d"/>

    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#eab308"/>
    <circle cx="59" cy="21" r="5" fill="#22c55e"/>

    <rect x="90" y="10" width="380" height="22" rx="6" fill="#081022" stroke="rgba(255,255,255,0.1)"/>
    <text x="110" y="25" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">https://infinity-business.solutions</text>

    <!-- Nav in Mockup -->
    <rect x="0" y="42" width="786" height="48" fill="#122547"/>
    <text x="30" y="72" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="800">INFINITY<tspan fill="#38bdf8">.BIZ</tspan></text>
    <text x="500" y="71" fill="#94a3b8" font-family="sans-serif" font-size="12">Home</text>
    <text x="555" y="71" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">Services</text>
    <text x="625" y="71" fill="#94a3b8" font-family="sans-serif" font-size="12">About</text>
    <rect x="685" y="55" width="80" height="26" rx="6" fill="url(#inf-blue)"/>
    <text x="702" y="72" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Inquire</text>

    <!-- Left Hero in Mockup -->
    <g transform="translate(35, 115)">
      <rect width="180" height="20" rx="10" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.3)"/>
      <text x="14" y="14" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">ENTERPRISE PORTAL</text>

      <text x="0" y="55" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="800">Next-Gen Corporate</text>
      <text x="0" y="85" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="800">Business Ecosystem</text>

      <text x="0" y="115" fill="#94a3b8" font-family="sans-serif" font-size="12">Comprehensive business services with interactive modal inquiries.</text>
      
      <rect x="0" y="140" width="140" height="34" rx="8" fill="url(#inf-blue)"/>
      <text x="24" y="162" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Explore Services ↗</text>
    </g>

    <!-- Right Services Showcase Cards -->
    <g transform="translate(460, 110)">
      <rect width="290" height="80" rx="10" fill="#0d1f3d" stroke="rgba(56,189,248,0.25)"/>
      <rect x="15" y="15" width="50" height="50" rx="8" fill="rgba(56,189,248,0.2)"/>
      <circle cx="40" cy="40" r="12" fill="#38bdf8"/>
      <text x="78" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Cloud Infrastructure</text>
      <text x="78" y="54" fill="#94a3b8" font-family="sans-serif" font-size="10">99.9% Uptime &amp; High Scale</text>

      <g transform="translate(0, 95)">
        <rect width="290" height="80" rx="10" fill="#0d1f3d" stroke="rgba(129,140,248,0.25)"/>
        <rect x="15" y="15" width="50" height="50" rx="8" fill="rgba(129,140,248,0.2)"/>
        <polygon points="40,28 52,48 28,48" fill="#818cf8"/>
        <text x="78" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">AI Business Logic</text>
        <text x="78" y="54" fill="#94a3b8" font-family="sans-serif" font-size="10">Automated Client Inquiries</text>
      </g>
    </g>

    <!-- Metrics Bar -->
    <g transform="translate(35, 345)">
      <rect width="715" height="70" rx="10" fill="#09142b" stroke="rgba(255,255,255,0.08)"/>
      
      <g transform="translate(50, 22)">
        <text x="0" y="16" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="800">15+</text>
        <text x="0" y="34" fill="#94a3b8" font-family="sans-serif" font-size="11">Services Offered</text>
      </g>
      <line x1="220" y1="15" x2="220" y2="55" stroke="rgba(255,255,255,0.1)"/>

      <g transform="translate(270, 22)">
        <text x="0" y="16" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800">100%</text>
        <text x="0" y="34" fill="#94a3b8" font-family="sans-serif" font-size="11">Responsive Design</text>
      </g>
      <line x1="440" y1="15" x2="440" y2="55" stroke="rgba(255,255,255,0.1)"/>

      <g transform="translate(490, 22)">
        <text x="0" y="16" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="800">Zero</text>
        <text x="0" y="34" fill="#94a3b8" font-family="sans-serif" font-size="11">External Dependencies</text>
      </g>
    </g>
  </g>
</svg>
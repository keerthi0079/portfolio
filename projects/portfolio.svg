<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%" height="100%">
  <defs>
    <linearGradient id="port-bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2b5c"/>
      <stop offset="50%" stop-color="#1e1438"/>
      <stop offset="100%" stop-color="#0d081f"/>
    </linearGradient>
    <linearGradient id="port-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f2b"/>
      <stop offset="50%" stop-color="#090617"/>
      <stop offset="100%" stop-color="#04020a"/>
    </linearGradient>
    <linearGradient id="port-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="830" height="540" rx="28" fill="url(#port-bezel)" stroke="#c084fc" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="16" y="16" width="818" height="528" rx="24" fill="#080514" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  
  <circle cx="425" cy="28" r="4" fill="#22183b" stroke="#3d2b63" stroke-width="1"/>
  <circle cx="425" cy="28" r="1.5" fill="#c084fc"/>

  <g transform="translate(32, 42)">
    <rect width="786" height="476" rx="16" fill="url(#port-screen)" stroke="#221642" stroke-width="1.5"/>

    <!-- Browser Header -->
    <rect width="786" height="42" rx="16" fill="#191136"/>
    <rect y="30" width="786" height="12" fill="#191136"/>

    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#eab308"/>
    <circle cx="59" cy="21" r="5" fill="#22c55e"/>

    <rect x="90" y="10" width="380" height="22" rx="6" fill="#0b071a" stroke="rgba(255,255,255,0.1)"/>
    <text x="110" y="25" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="600">https://keerthi.netmaxin.in</text>

    <!-- Nav Bar -->
    <rect x="0" y="42" width="786" height="48" fill="#1c123d"/>
    <text x="30" y="72" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="800">KEERTHI<tspan fill="#38bdf8">.</tspan></text>
    <text x="460" y="71" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700">Home</text>
    <text x="515" y="71" fill="#94a3b8" font-family="sans-serif" font-size="12">About</text>
    <text x="570" y="71" fill="#94a3b8" font-family="sans-serif" font-size="12">Skills</text>
    <text x="625" y="71" fill="#94a3b8" font-family="sans-serif" font-size="12">Projects</text>
    <rect x="690" y="55" width="75" height="26" rx="6" fill="url(#port-purple)"/>
    <text x="702" y="72" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Contact</text>

    <!-- Hero Content Showcase -->
    <g transform="translate(35, 120)">
      <rect width="190" height="22" rx="11" fill="rgba(192,132,252,0.15)" stroke="rgba(192,132,252,0.3)"/>
      <circle cx="16" cy="11" r="4" fill="#34d399"/>
      <text x="28" y="15" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="700">AVAILABLE FOR ROLES</text>

      <text x="0" y="60" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="800">Hi, I'm Pentapalli</text>
      <text x="0" y="95" fill="#38bdf8" font-family="sans-serif" font-size="26" font-weight="800">Keerthi</text>

      <text x="0" y="130" fill="#a5b4fc" font-family="sans-serif" font-size="13">Computer Science Undergraduate • IoT, Cyber &amp; Blockchain</text>
      
      <rect x="0" y="155" width="130" height="34" rx="8" fill="url(#port-purple)"/>
      <text x="24" y="177" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">View Projects ↗</text>
    </g>

    <!-- Right Side Portrait Frame Representation in Portfolio -->
    <g transform="translate(540, 115)">
      <rect width="200" height="260" rx="20" fill="#1c113b" stroke="rgba(192,132,252,0.4)" stroke-width="2"/>
      <circle cx="100" cy="95" r="45" fill="#2d1c59" stroke="#818cf8" stroke-width="2"/>
      <path d="M 60 190 Q 100 150 140 190 Z" fill="#2d1c59" stroke="#818cf8" stroke-width="2"/>
      
      <!-- Sparkles icon -->
      <polygon points="170,40 174,48 182,52 174,56 170,64 166,56 158,52 166,48" fill="#fbbf24"/>
      <polygon points="35,160 38,166 44,169 38,172 35,178 32,172 26,169 32,166" fill="#38bdf8"/>

      <rect x="25" y="215" width="150" height="26" rx="8" fill="#0c071d" stroke="rgba(255,255,255,0.1)"/>
      <text x="42" y="232" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">● B.Tech CSE '27</text>
    </g>

    <!-- Bottom Feature Pills -->
    <g transform="translate(35, 345)">
      <rect width="715" height="70" rx="10" fill="#0d0921" stroke="rgba(255,255,255,0.08)"/>
      
      <g transform="translate(30, 20)">
        <text x="0" y="18" fill="#c084fc" font-family="sans-serif" font-size="16" font-weight="800">Particles &amp; Sparks</text>
        <text x="0" y="34" fill="#94a3b8" font-family="sans-serif" font-size="10">Interactive Canvas Engine</text>
      </g>
      <line x1="220" y1="15" x2="220" y2="55" stroke="rgba(255,255,255,0.1)"/>

      <g transform="translate(260, 20)">
        <text x="0" y="18" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="800">Glassmorphism</text>
        <text x="0" y="34" fill="#94a3b8" font-family="sans-serif" font-size="10">Deep Space Modern UI</text>
      </g>
      <line x1="460" y1="15" x2="460" y2="55" stroke="rgba(255,255,255,0.1)"/>

      <g transform="translate(500, 20)">
        <text x="0" y="18" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="800">100% Responsive</text>
        <text x="0" y="34" fill="#94a3b8" font-family="sans-serif" font-size="10">Zero Bloat Vanilla ES6</text>
      </g>
    </g>

  </g>
</svg>
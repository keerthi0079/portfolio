<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%" height="100%">
  <defs>
    <linearGradient id="med-bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b3830"/>
      <stop offset="50%" stop-color="#0c241e"/>
      <stop offset="100%" stop-color="#051410"/>
    </linearGradient>
    <linearGradient id="med-scr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09221b"/>
      <stop offset="50%" stop-color="#041410"/>
      <stop offset="100%" stop-color="#020a08"/>
    </linearGradient>
    <linearGradient id="ecg-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Tablet Bezel -->
  <rect x="10" y="10" width="830" height="540" rx="28" fill="url(#med-bezel)" stroke="#34d399" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="16" y="16" width="818" height="528" rx="24" fill="#04120e" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  
  <circle cx="425" cy="28" r="4" fill="#13362c" stroke="#1f5142" stroke-width="1"/>
  <circle cx="425" cy="28" r="1.5" fill="#34d399"/>

  <g transform="translate(32, 42)">
    <rect width="786" height="476" rx="16" fill="url(#med-scr)" stroke="#13382d" stroke-width="1.5"/>

    <!-- Header Bar -->
    <rect width="786" height="42" rx="16" fill="#082920"/>
    <rect y="30" width="786" height="12" fill="#082920"/>
    
    <circle cx="24" cy="21" r="5" fill="#34d399"/>
    <text x="38" y="26" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="1">E-SWASTHYA <tspan fill="#34d399">CONNECT</tspan></text>
    
    <!-- Role Switcher -->
    <g transform="translate(230, 9)">
      <rect width="85" height="24" rx="6" fill="#0e4033"/>
      <text x="16" y="16" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">Villager</text>

      <rect x="95" width="85" height="24" rx="6" fill="#1b6350"/>
      <text x="106" y="16" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">ANMS Area</text>

      <rect x="190" width="85" height="24" rx="6" fill="#0e4033"/>
      <text x="210" y="16" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">Doctor</text>
    </g>

    <text x="615" y="26" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">● 20+ PHP PAGES ACTIVE</text>

    <!-- LEFT: Patient Ingestion & Photo Upload -->
    <g transform="translate(18, 55)">
      <rect width="365" height="195" rx="10" fill="#071c16" stroke="rgba(255,255,255,0.08)"/>
      <text x="16" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Patient Case Ingestion &amp; Photo Triage</text>
      
      <g transform="translate(16, 38)">
        <rect width="333" height="72" rx="8" fill="#0b2e24" stroke="rgba(52,211,153,0.2)"/>
        <rect x="12" y="11" width="50" height="50" rx="6" fill="#051712"/>
        <text x="18" y="40" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="800">PHOTO</text>
        <text x="74" y="28" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Case #RUR-849: Acute Respiratory</text>
        <text x="74" y="44" fill="#94a3b8" font-family="sans-serif" font-size="9">Patient: Villager (Age 42) • Vizianagaram Area</text>
        <rect x="74" y="50" width="75" height="15" rx="3" fill="#ef4444"/>
        <text x="80" y="61" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="700">HIGH PRIORITY</text>
      </g>

      <!-- Action triage buttons -->
      <g transform="translate(16, 122)">
        <rect width="160" height="36" rx="6" fill="url(#ecg-glow)"/>
        <text x="24" y="23" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Assign to ANMS ↗</text>

        <rect x="173" width="160" height="36" rx="6" fill="#0f3b2f" stroke="#34d399" stroke-width="1"/>
        <text x="190" y="23" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">Escalate to Doctor</text>
      </g>

      <text x="16" y="180" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="600">● Role-Based Access Control (RBAC) &amp; CSRF Safe</text>

      <!-- LOWER: Live Telemetry ECG Waveform -->
      <g transform="translate(0, 205)">
        <rect width="365" height="195" rx="10" fill="#071c16" stroke="rgba(56,189,248,0.2)"/>
        <text x="16" y="24" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">Vitals Telemetry &amp; Consultation Log</text>

        <g transform="translate(16, 38)">
          <rect width="333" height="75" rx="6" fill="#04120e"/>
          <!-- ECG wave -->
          <path d="M 10 38 L 60 38 L 75 18 L 90 60 L 105 25 L 120 48 L 135 38 L 190 38 L 205 18 L 220 60 L 235 38 L 320 38" fill="none" stroke="#34d399" stroke-width="2.5"/>
          <text x="12" y="16" fill="#34d399" font-family="monospace" font-size="9">PULSE: 74 BPM | SPO2: 98%</text>
        </g>

        <!-- Doctor response guide -->
        <rect x="16" y="125" width="333" height="55" rx="6" fill="#0d352b"/>
        <text x="26" y="145" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">Doctor Dr. Rao (Certified Clinical MD):</text>
        <text x="26" y="163" fill="#a7f3d0" font-family="sans-serif" font-size="9">"Prescribe nebulization + oral fluids. ANMS dispatched."</text>
      </g>
    </g>

    <!-- RIGHT: Healthcare Infrastructure & Database Map -->
    <g transform="translate(400, 55)">
      <rect width="368" height="400" rx="10" fill="#071c16" stroke="rgba(52,211,153,0.2)"/>
      <text x="18" y="24" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">Rural Healthcare Connectivity Network</text>
      
      <!-- Network Nodes in health district -->
      <g stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5">
        <line x1="184" y1="90" x2="100" y2="160"/>
        <line x1="184" y1="90" x2="270" y2="160"/>
        <line x1="100" y1="160" x2="70" y2="250"/>
        <line x1="100" y1="160" x2="184" y2="220"/>
        <line x1="270" y1="160" x2="184" y2="220"/>
        <line x1="270" y1="160" x2="300" y2="250"/>
        <line x1="184" y1="220" x2="184" y2="310"/>
      </g>

      <circle cx="184" cy="90" r="16" fill="#0f3b2f" stroke="#34d399" stroke-width="2"/>
      <circle cx="184" cy="90" r="6" fill="#34d399"/>
      <text x="184" y="118" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700">HQ Hospital</text>

      <circle cx="100" cy="160" r="12" fill="#0f3b2f" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="100" cy="160" r="4" fill="#38bdf8"/>
      <text x="100" y="184" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="8">ANMS Unit 1</text>

      <circle cx="270" cy="160" r="12" fill="#0f3b2f" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="270" cy="160" r="4" fill="#38bdf8"/>
      <text x="270" y="184" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="8">ANMS Unit 2</text>

      <circle cx="184" cy="220" r="15" fill="#1b6350" stroke="#ffffff" stroke-width="2"/>
      <circle cx="184" cy="220" r="5" fill="#ffffff"/>
      <text x="184" y="246" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700">Triage Hub</text>

      <!-- Stat Badges below -->
      <g transform="translate(18, 300)">
        <rect width="158" height="85" rx="8" fill="#0b2e24" stroke="rgba(52,211,153,0.3)"/>
        <text x="14" y="26" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="800">100% SQL</text>
        <text x="14" y="44" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">Prepared Statements</text>
        <text x="14" y="60" fill="#94a3b8" font-family="sans-serif" font-size="8.5">Zero SQL Injection Vulnerability</text>
      </g>

      <g transform="translate(192, 300)">
        <rect width="158" height="85" rx="8" fill="#0b2e24" stroke="rgba(52,211,153,0.3)"/>
        <text x="14" y="26" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="800">Emergency</text>
        <text x="14" y="44" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">Click-to-Call Triage</text>
        <text x="14" y="60" fill="#94a3b8" font-family="sans-serif" font-size="8.5">Real-time Patient Dispatch</text>
      </g>
    </g>

  </g>
</svg>